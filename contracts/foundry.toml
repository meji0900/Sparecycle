[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib", "../node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# OpenZeppelin v5 comes from the root npm devDependency, so CI needs no git submodules for it.
remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Deploy.s.sol reads env; sync-deployments reads broadcast output.
fs_permissions = [{ access = "read", path = "./" }, { access = "read", path = "../src/contracts" }]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
fail_on_revert = true

# Public RPCs (no key). Fork tests only simulate locally against these; nothing is broadcast.
[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
anvil = "http://127.0.0.1:8545"

[lint]
lint_on_build = false
